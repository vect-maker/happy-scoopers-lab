version: 2

models:
  - name: dim_product
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [not_null]
      - name: is_discontinued
        data_tests:
          - accepted_values:
              arguments:
                values: ['Sí', 'No', 'N/A']
  - name: dim_date
    description: >
      Dimensión Fecha (calendario). Una fila por día.
      Incluye una fila "desconocido" (date_key = -1) para hechos sin fecha.
    columns:
      - name: date_key
        description: "Llave única de la fecha (YYYYMMDD). -1 = desconocido."
        data_tests:
          - unique
          - not_null
      - name: day_type
        description: "'Entre semana' | 'Fin de semana' | 'N/A'."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entre semana', 'Fin de semana', 'N/A']
